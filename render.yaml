services:
  - type: web
    name: insightflow-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: MODEL_PATH
        value: app/ml/risk_model.pkl
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: insightflow-db
          property: connectionString
      - key: BACKEND_CORS_ORIGINS
        value: '["https://insightflow-frontend.onrender.com"]'
    healthCheckPath: /health
    autoDeploy: true

  - type: static
    name: insightflow-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://insightflow-backend.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true

databases:
  - name: insightflow-db
    databaseName: insightflow
    user: insightflow
    plan: free