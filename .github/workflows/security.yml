name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM
  workflow_dispatch:

jobs:
  # ============================================================
  # CONTAINER SCANNING
  # ============================================================
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: |
          docker build -t insightflow-backend:scan ./backend

      - name: Build frontend image
        run: |
          docker build -t insightflow-frontend:scan ./frontend

      - name: Run Trivy on backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'insightflow-backend:scan'
          format: 'table'
          output: 'trivy-backend.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'  # Don't fail, just report
          vuln-type: 'os,library'

      - name: Run Trivy on frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'insightflow-frontend:scan'
          format: 'table'
          output: 'trivy-frontend.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          vuln-type: 'os,library'

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: |
            trivy-backend.txt
            trivy-frontend.txt

  # ============================================================
  # SECRET SCANNING
  # ============================================================
  trufflehog-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --no-verification --json --fail

  # ============================================================
  # DEPENDENCY SCANNING
  # ============================================================
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend - Safety check
        run: |
          cd backend
          pip install safety
          safety check -r requirements.txt --json --output safety-report.json || true
          cat safety-report.json | jq '.'

      - name: Frontend - npm audit
        run: |
          cd frontend
          npm audit --json > audit-report.json || true
          cat audit-report.json | jq '.'

      - name: Frontend - OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'insightflow-frontend'
          path: './frontend'
          format: 'JSON'
          out: 'dependency-check-report.json'

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            backend/safety-report.json
            frontend/audit-report.json
            dependency-check-report.json

  # ============================================================
  # SAST - STATIC ANALYSIS
  # ============================================================
  sast-scan:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >
            p/security-audit
            p/secrets
            p/python
            p/typescript
            p/docker
            p/kubernetes
          generateSarif: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif

  # ============================================================
  # IaC SCANNING
  # ============================================================
  iac-scan:
    name: Infrastructure as Code Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ./terraform
          framework: terraform
          output_format: cli,json
          output_file_path: checkov-report.json

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1
        with:
          directory: ./terraform
          format: json
          output: tfsec-report.json

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: iac-reports
          path: |
            checkov-report.json
            tfsec-report.json

  # ============================================================
  # SBOM GENERATION
  # ============================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate SBOM for backend
        uses: anchore/sbom-action@v0
        with:
          path: ./backend
          format: spdx-json
          output-file: sbom-backend.spdx.json

      - name: Generate SBOM for frontend
        uses: anchore/sbom-action@v0
        with:
          path: ./frontend
          format: spdx-json
          output-file: sbom-frontend.spdx.json

      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sboms
          path: |
            sbom-backend.spdx.json
            sbom-frontend.spdx.json

  # ============================================================
  # POLICY CHECK
  # ============================================================
  policy-check:
    name: Policy Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for required files
        run: |
          REQUIRED_FILES=(
            "README.md"
            "LICENSE"
            "SECURITY.md"
            "CONTRIBUTING.md"
            ".github/CODEOWNERS"
            ".github/dependabot.yml"
          )
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi
          done

      - name: Check branch protection
        if: github.event_name == 'pull_request'
        run: |
          echo "Branch protection checks would run here"
          # This would check if PR is from protected branch, etc.

  # ============================================================
  # SUMMARY
  # ============================================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - trivy-scan
      - trufflehog-scan
      - dependency-scan
      - sast-scan
      - iac-scan
      - sbom
      - policy-check
    if: always()
    steps:
      - name: Summarize results
        run: |
          echo "Security Scan Summary"
          echo "====================="
          echo "trivy-scan: ${{ needs.trivy-scan.result }}"
          echo "trufflehog-scan: ${{ needs.trufflehog-scan.result }}"
          echo "dependency-scan: ${{ needs.dependency-scan.result }}"
          echo "sast-scan: ${{ needs.sast-scan.result }}"
          echo "iac-scan: ${{ needs.iac-scan.result }}"
          echo "sbom: ${{ needs.sbom.result }}"
          echo "policy-check: ${{ needs.policy-check.result }}"

      - name: Create GitHub Security Advisory (if critical found)
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security Scan Failures Detected',
              body: 'One or more security scans failed. Please review the workflow artifacts.',
              labels: ['security', 'automated']
            })
