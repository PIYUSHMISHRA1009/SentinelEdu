name: Continuous Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version tag (optional)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================
  # DEPLOY TO STAGING
  # ============================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (for EKS)
        uses: aws-actions/configure-aws-credentials@v4
        if: ${{ env.AWS_ROLE_ARN != '' }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure GCP credentials (for GKE)
        uses: google-github-actions/auth@v2
        if: ${{ env.GCP_SA_KEY != '' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_STAGING }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Deploy with Helm
        run: |
          helm upgrade --install insightflow ./helm/insightflow \
            --namespace insightflow-staging \
            --create-namespace \
            --values ./helm/insightflow/values-staging.yaml \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.tag=${{ github.sha }} \
            --wait --timeout 10m

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/insightflow-backend -n insightflow-staging --timeout=300s
          kubectl rollout status deployment/insightflow-frontend -n insightflow-staging --timeout=300s
          curl -f https://staging.insightflow.edu/health

      - name: Run smoke tests
        run: |
          cd backend
          pytest tests/smoke/ -v --base-url=https://staging.insightflow.edu

  # ============================================================
  # DEPLOY TO PRODUCTION
  # ============================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: ${{ env.AWS_ROLE_ARN != '' }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure GCP credentials
        uses: google-github-actions/auth@v2
        if: ${{ env.GCP_SA_KEY != '' }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: '3.14.0'

      - name: Blue-Green Deploy
        run: |
          # Deploy to green namespace
          helm upgrade --install insightflow-green ./helm/insightflow \
            --namespace insightflow-green \
            --create-namespace \
            --values ./helm/insightflow/values-production.yaml \
            --set backend.image.tag=${{ steps.version.outputs.tag }} \
            --set frontend.image.tag=${{ steps.version.outputs.tag }} \
            --wait --timeout 15m

      - name: Verify green deployment
        run: |
          kubectl rollout status deployment/insightflow-backend -n insightflow-green --timeout=300s
          kubectl rollout status deployment/insightflow-frontend -n insightflow-green --timeout=300s
          curl -f https://green.insightflow.edu/health

      - name: Run smoke tests on green
        run: |
          cd backend
          pytest tests/smoke/ -v --base-url=https://green.insightflow.edu

      - name: Switch traffic to green (manual approval)
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.token }}
          approvers: platform-team
          minimum-approvals: 2
          issue-title: "Production Deployment Approval"
          issue-body: |
            Green deployment verified. Ready to switch traffic?
            Version: ${{ steps.version.outputs.tag }}
            Green URL: https://green.insightflow.edu

      - name: Switch ingress to green
        run: |
          kubectl patch ingress insightflow-ingress -n insightflow-production \
            -p '{"spec":{"rules":[{"host":"insightflow.edu","http":{"paths":[{"path":"/","pathType":"Prefix","backend":{"service":{"name":"insightflow-frontend-green","port":{"number":80}}}]}}]}}'

      - name: Verify production
        run: |
          sleep 30
          curl -f https://insightflow.edu/health

      - name: Cleanup blue (previous)
        run: |
          kubectl delete namespace insightflow-blue --ignore-not-found=true
          kubectl label namespace insightflow-green name=insightflow-production --overwrite

  # ============================================================
  # ROLLBACK
  # ============================================================
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: ${{ env.AWS_ROLE_ARN != '' }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up kubectl
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG_PRODUCTION }}

      - name: Rollback to previous version
        run: |
          # ArgoCD rollback or Helm rollback
          helm rollback insightflow 1 -n insightflow-production --wait --timeout 5m
          kubectl rollout status deployment/insightflow-backend -n insightflow-production --timeout=300s
          kubectl rollout status deployment/insightflow-frontend -n insightflow-production --timeout=300s

      - name: Verify rollback
        run: |
          curl -f https://insightflow.edu/health
